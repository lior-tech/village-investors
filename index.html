<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Village by BOA Brand and Results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Quattrocento:wght@400;700&display=swap">
<style>
:root{--gesso:#F2EAE6;--gesso-deep:#ECE4DE;--pitch:#3D3935;--ink-2:#57504A;--terra:#B96955}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:url("assets/grain.png") 0 0/256px repeat,var(--gesso-deep);color:var(--pitch);font-family:"Quattrocento",Georgia,"Times New Roman",serif;-webkit-font-smoothing:antialiased}
.gate{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:48px max(24px,env(safe-area-inset-right,0px)) 48px max(24px,env(safe-area-inset-left,0px))}
.card{width:100%;max-width:980px;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,6vw,88px);align-items:center}
.logo{justify-self:end;width:clamp(150px,17vw,220px);height:auto}
.eyebrow{font-size:13px;letter-spacing:.28em;text-transform:uppercase;color:var(--ink-2)}
h1{font-weight:400;font-size:clamp(32px,3.6vw,46px);line-height:1.15;margin-top:18px}
h1 span{color:var(--terra)}
.sub{margin-top:18px;font-size:17px;letter-spacing:.04em;line-height:1.6;color:var(--ink-2);max-width:30em}
form{margin-top:30px;display:flex;gap:10px;flex-wrap:wrap;max-width:420px}
input{flex:1 1 220px;min-width:0;font:inherit;font-size:17px;letter-spacing:.06em;padding:13px 16px;border:1px solid rgba(61,57,53,.45);background:rgba(248,243,239,.7);color:var(--pitch);border-radius:0}
input:focus{outline:2px solid var(--terra);outline-offset:1px}
button{font:inherit;font-size:14px;letter-spacing:.24em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--pitch);background:var(--pitch);color:var(--gesso);cursor:pointer}
button:hover{background:#2f2c29}
.busy,.err{min-height:22px;margin-top:12px;font-size:14px;letter-spacing:.12em}
.busy{text-transform:uppercase;color:var(--ink-2)}
.err{color:#9C4A36}
.ft{margin-top:36px;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
@media (max-width:720px){.card{grid-template-columns:1fr;text-align:center;justify-items:center}.logo{justify-self:center;width:140px}form{margin-inline:auto;justify-content:center}.sub{margin-inline:auto}}
</style></head><body>
<main class="gate"><div class="card">
<img class="logo" src="assets/village-logo.png" alt="Village by BOA" width="900" height="1323">
<div>
<p class="eyebrow">Village by BOA · Investor presentation</p>
<h1>Brand Overview<br>and Results <span>2026</span></h1>
<p class="sub">This presentation is reserved for invited investors. Enter the access code to open it.</p>
<form id="f" onsubmit="try{window.__go&&__go()}catch(x){}return false"><input id="c" type="password" placeholder="Access code" autocomplete="off" autofocus aria-label="Access code"><button type="submit">Open</button></form>
<div class="busy" id="b" aria-live="polite"></div><div class="err" id="e" role="alert"></div>
<p class="ft">© 2026 BOA Hotels. All rights reserved.</p>
</div>
</div></main>

    const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b2a(IV)},key,b2a(CT));
    return new TextDecoder().decode(pt);
  }
  const key=asmCrypto.Pbkdf2HmacSha256(new TextEncoder().encode(pass),b2a(SALT),ITER,32);
  const pt=asmCrypto.AES_GCM.decrypt(b2a(CT),key,b2a(IV),undefined,16);
  return new TextDecoder().decode(pt);
}
function store(get,val){try{if(get)return sessionStorage.getItem(KEY_NAME); if(val===null)sessionStorage.removeItem(KEY_NAME); else sessionStorage.setItem(KEY_NAME,val);}catch(x){} return null;}
async function tryPass(pass,silent){
  const b=document.getElementById("b"),e=document.getElementById("e");
  if(!pass){ if(!silent)e.textContent="Enter the access code."; return; }
  b.textContent="Opening"; e.textContent="";
  try{
    const html=await unlock(pass);
    store(false,pass);
    document.open(); document.write("<!doctype html>"+html); document.close();
  }catch(x){
    b.textContent="";
    if(!silent){ e.textContent="That code is not correct."; }
    store(false,null);
  }
}
